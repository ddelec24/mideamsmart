# Tests of the Python daemon, with the locked dependencies of resources/requirements.lock
on:
  push:
    branches:
      - beta
      - master
  pull_request:
    branches:
      - beta
      - master

name: 'Daemon tests'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the locked dependencies
        run: python -m pip install --require-hashes -r resources/requirements.lock
      - name: Run the tests
        working-directory: resources/mideamsmartd
        run: python -m unittest discover -s tests -t . -v
